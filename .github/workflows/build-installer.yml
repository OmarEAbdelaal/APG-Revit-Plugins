name: Build installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a GitHub release with this tag (e.g. v1.5.0) and attach the installer.
          Run from main; the tag is created at the built commit. Leave empty to only build.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Builds all Revit targets (skipping any whose API package is unavailable)
      # and compiles the Inno Setup installer. Inno Setup 6 is preinstalled on
      # windows-latest runners.
      - name: Build add-in and installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: APG-Revit-Plugins-Setup
          path: installer/output/*.exe
          if-no-files-found: error

  # Build code never receives a write token. This job does not execute repository
  # scripts: it validates the source and publishes this run's installer artifact.
  release:
    needs: installer
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download this run's installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: APG-Revit-Plugins-Setup
          path: installer/output

      - name: Publish installer release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: installer/output/*.exe
          fail_on_unmatched_files: true
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
