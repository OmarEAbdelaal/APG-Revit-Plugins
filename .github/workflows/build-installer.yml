name: Build installer

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a GitHub release with this tag (e.g. v1.5.0) and attach the installer.
          The tag is created on the branch this workflow runs from. Leave empty to only build.
        required: false
        default: ""

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write # needed to attach the installer to releases on tag push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Builds all Revit targets (skipping any whose API package is unavailable)
      # and compiles the Inno Setup installer. Inno Setup 6 is preinstalled on
      # windows-latest runners.
      - name: Build add-in and installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: APG-Revit-Plugins-Setup
          path: installer/output/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe

      # Lets a release be published without pushing a tag from a workstation
      # (Actions ▸ Build installer ▸ Run workflow ▸ fill in the tag).
      - name: Publish release from a manual run
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag }}
          generate_release_notes: true
